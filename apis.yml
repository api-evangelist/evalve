name: Evalve
description: 'Evalve, Inc. was a medical-device company that pioneered percutaneous (catheter-based)
  mitral valve repair with its MitraClip system for treating mitral regurgitation. It was acquired by
  Abbott Laboratories in 2009 (~$410M) and folded into Abbott Structural Heart / Abbott Vascular;
  MitraClip is now an Abbott product. Evalve does not exist as an independent operating company and
  publishes no developer program, public API, SDKs, or developer documentation. The former evalve.com
  domain is a parked, for-sale page. Surfaced here as a kleiner-perkins portfolio lead, this is a
  non-API, defunct/acquired entity with no enrichable API surface.'
